name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: robotframework-electron-vscode
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          path: robotframework-electron-vscode

      # mypy reads the Browser clone, and RobotCode's analysis imports the libraries,
      # which import Browser, so the clone needs its generated code.
      - name: Check out the Browser library with the adoptContext hook
        uses: actions/checkout@v7
        with:
          repository: d-biehl/robotframework-browser
          ref: adopted-context-recording
          path: robotframework-browser

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: astral-sh/setup-uv@v10.3.0

      - name: Build the Browser library
        working-directory: robotframework-browser
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python pip -r Browser/dev-requirements.txt
          . .venv/bin/activate
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 inv build

      - name: Install the workspace
        run: uv sync

      - name: Run the pre-commit checks
        run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    name: test (Python ${{ matrix.python }})
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # The versions of .python-version and the lock file.
          - python: "3.13"
          # The lowest versions that the Browser library supports.
          - python: "3.10"
            sync: --upgrade-package robotframework==7.1.1
    # Takes precedence over .python-version for every uv command of the job.
    env:
      UV_PYTHON: ${{ matrix.python }}
    defaults:
      run:
        working-directory: robotframework-electron-vscode
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          path: robotframework-electron-vscode

      # Until a Browser release contains the adoptContext hook and its follow-up, the
      # workspace takes robotframework-browser from a clone of the fork next to the repository.
      - name: Check out the Browser library with the adoptContext hook
        uses: actions/checkout@v7
        with:
          repository: d-biehl/robotframework-browser
          ref: adopted-context-recording
          path: robotframework-browser

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: astral-sh/setup-uv@v10.3.0

      - name: Install Xvfb and Openbox
        run: sudo apt-get update && sudo apt-get install -y xvfb openbox

      # Ubuntu restricts unprivileged user namespaces, which the Chromium sandbox
      # of Electron and VS Code needs.
      - name: Allow the Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build the Browser library
        working-directory: robotframework-browser
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python pip -r Browser/dev-requirements.txt
          . .venv/bin/activate
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 inv build
          PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install --with-deps chromium

      # Not --locked: the lock file records the Browser clone's dependencies,
      # which change with the branch. The lowest versions change it in the checkout only.
      - name: Install the workspace
        run: uv sync ${{ matrix.sync }}

      # The build packs the helper extension's .vsix into the source tree, where
      # the acceptance tests install it, and checks the build in each cell.
      - name: Build the VSCode package
        run: uv build --package robotframework-vscode -o dist

      - name: Unit tests
        run: uv run pytest

      - name: Static analysis
        run: uv run robotcode -r . analyze code

      - name: Acceptance tests
        run: uv run robotcode -r . -p xvfb robot

      - name: Summary of the acceptance tests
        if: always()
        run: uv run robotcode -r . results summary --failed >> "$GITHUB_STEP_SUMMARY"

      # Without the caches of the VS Code instances, but with their logs and settings.
      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-python-${{ matrix.python }}
          path: |
            robotframework-electron-vscode/results/
            !robotframework-electron-vscode/results/vscode/*/user-data/Cached*/**
            !robotframework-electron-vscode/results/vscode/*/user-data/*Cache/**
            !robotframework-electron-vscode/results/vscode/*/user-data/Dictionaries/**
          if-no-files-found: ignore

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # The version comes from the tags and the commits since the last one.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.3.0

      # The build of robotframework-vscode packs its helper extension with vsce.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Write the version from git
        run: uv run scripts/update_versions.py

      - name: Build the packages
        run: uv build --all-packages -o dist

      - name: Upload the packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: dist/
          if-no-files-found: error
