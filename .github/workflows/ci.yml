name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0

      - name: Install the workspace
        run: uv sync --locked

      - name: Run the pre-commit checks
        run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    name: test (Python ${{ matrix.python }})
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # The versions of .python-version and the lock file.
          - python: "3.13"
          # The lowest versions that the libraries run on.
          - python: "3.11"
            sync: --upgrade-package robotframework==7.1.1 --upgrade-package robotframework-browser==21.0.0
          # The newer Python versions.
          - python: "3.14"
          - python: "3.15"
    # Takes precedence over .python-version for every uv command of the job.
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: astral-sh/setup-uv@v10.3.0

      - name: Install Xvfb and Openbox
        run: sudo apt-get update && sudo apt-get install -y xvfb openbox

      # The lowest versions change the lock file in the checkout only.
      - name: Install the workspace
        run: uv sync ${{ matrix.sync || '--locked' }}

      # Chromium and Playwright's ffmpeg for the tests, and the system packages of
      # Chromium, which Electron needs too.
      - name: Complete the installation of the Browser library
        run: uv run rfbrowser init --with-deps chromium

      # The build packs the helper extension's .vsix into the source tree, where
      # the acceptance tests install it, and checks the build in each cell.
      - name: Build the VSCode package
        run: uv build --package robotframework-vscode -o dist

      # VS Code from @vscode/test-electron and Electron from npm, at the paths in robot.toml.
      - name: Prepare VS Code and Electron for the tests
        run: |
          npm ci
          npm run prepare-tests

      - name: Unit tests
        run: uv run pytest

      - name: Static analysis
        run: uv run robotcode -r . analyze code

      - name: Acceptance tests
        run: uv run robotcode -r . -p xvfb robot

      - name: Summary of the acceptance tests
        if: always()
        run: uv run robotcode -r . results summary --failed >> "$GITHUB_STEP_SUMMARY"

      # Without the caches of the VS Code instances, but with their logs and settings.
      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-python-${{ matrix.python }}
          path: |
            results/
            !results/**/*user-data/Cached*/**
            !results/**/*user-data/*Cache/**
            !results/**/*user-data/Dictionaries/**
          if-no-files-found: ignore

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # The version comes from the tags and the commits since the last one.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.3.0

      # The build of robotframework-vscode packs its helper extension with vsce.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Write the version from git
        run: uv run scripts/update_versions.py

      - name: Build the packages
        run: uv build --all-packages -o dist

      - name: Upload the packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: dist/
          if-no-files-found: error
