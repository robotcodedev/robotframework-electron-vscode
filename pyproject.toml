[project]
name = "robotframework-electron-vscode"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["robotframework-electron", "robotframework-vscode"]

[tool.uv.workspace]
members = [
    "packages/electron",
    "packages/vscode",
]

[tool.uv.sources]
robotframework-electron = { workspace = true }
robotframework-vscode = { workspace = true }
# Local clone of the Browser library with our hook, prepared with `inv deps && inv build`.
# Switch to the PyPI release once the hook is published.
robotframework-browser = { path = "../robotframework-browser", editable = true }

[dependency-groups]
dev = [
    "commitizen>=4.19.2",
    "git-cliff>=2.14.2",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=8",
    "robotcode[analyze,repl,runner]>=2.7.0",
    "ruff>=0.17.0",
]

[tool.commitizen]
name = "cz_conventional_commits"
bump_message = "chore(release): bump version $current_version → $new_version"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "scm"
# 0.x: a breaking change raises the minor version.
major_version_zero = true
# git-cliff writes the changelog, see cliff.toml.
update_changelog_on_bump = false
gpg_sign = true
annotated_tag = true
pre_bump_hooks = [
    "uv run scripts/update_versions.py",
    "uv run git-cliff --tag v$CZ_PRE_NEW_VERSION -o CHANGELOG.md",
    "uv lock --offline",
    "git add CHANGELOG.md uv.lock pyproject.toml packages/electron/pyproject.toml packages/vscode/pyproject.toml packages/vscode/src/VSCode/extension/package.json",
]

[tool.pytest.ini_options]
testpaths = ["packages/electron/tests", "packages/vscode/tests", "scripts/tests"]
addopts = "--import-mode=importlib"
# The tests of the scripts import them as `scripts.<name>`.
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"
include = ["packages/**/*.py", "examples/**/*.py", "docs/scripts/**/*.py", "scripts/**/*.py"]

[tool.ruff.lint]
# Like robotframework-platynui: Ruff's default rule set plus the families it does not cover.
# A Ruff upgrade can widen the default set; triage new findings and extend `ignore` here.
ignore = [
    "E741",
    "ISC001",
    "N999",   # Robot Framework libraries have capitalized module names such as `Electron`
    "RUF012",
    "D100",   # missing docstring in module
    "D102",   # missing docstring in public method
    "D104",   # missing docstring in public package
    "D105",   # missing docstring in magic methods
    "D107",   # missing docstring in __init__ methods
]
extend-select = ["E", "F", "W", "I", "N", "YTT", "DTZ", "T10", "ISC", "G", "PIE", "PT", "Q", "RET", "RSE", "RUF"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["Electron", "VSCode"]
known-third-party = ["Browser", "robot", "robotlibcore"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["D"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
# robotlibcore's `keyword` decorator has no type hints.
disallow_untyped_decorators = false
# Both packages have test modules of the same name. Module names relative to the
# repository root keep them apart, while the sources keep their import names.
explicit_package_bases = true
# The Browser clone is installed through an import hook, which mypy cannot follow,
# so it is on the path until Browser is released with the adoptContext hook.
mypy_path = ["packages/electron/src", "packages/vscode/src", "../robotframework-browser", "."]
files = [
    "packages/electron/src",
    "packages/vscode/src",
    "packages/electron/tests",
    "packages/vscode/tests",
    "packages/electron/atest/resources",
    "packages/vscode/atest/resources",
    "docs/scripts",
    "scripts",
]

[[tool.mypy.overrides]]
module = ["robot.*", "robotlibcore.*"]
ignore_missing_imports = true

# Browser's types, without reporting the errors of Browser's own code.
[[tool.mypy.overrides]]
module = ["Browser", "Browser.*"]
follow_imports = "silent"
ignore_errors = true

# Tests need no annotations on every test function, but their bodies are checked.
[[tool.mypy.overrides]]
module = ["packages.electron.tests.*", "packages.vscode.tests.*", "scripts.tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
